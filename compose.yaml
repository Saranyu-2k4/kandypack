# Shared base configuration
services:
  server:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:fb836341-cb64-4e46-b2f8-af29f7057cbd@db:5432/kandypack
      - HOME=/tmp
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false

  db:
    image: postgres:18.6-trixie
    restart: always
    user: postgres
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=kandypack
      - POSTGRES_PASSWORD=fb836341-cb64-4e46-b2f8-af29f7057cbd
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data: